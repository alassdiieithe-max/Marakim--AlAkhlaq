name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Project
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew* .github/workflows/workflowsbuild.yml
          mkdir -p app/src/main/java/com/makarim/akhlaq
          cat > settings.gradle <<'END'
          include ':app'
          END
          cat > build.gradle <<'END'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          END
          cat > app/build.gradle <<'END'
          plugins { id 'com.android.application' }
          android {
            compileSdk 34
            namespace 'com.makarim.akhlaq'
            defaultConfig {
              applicationId 'com.makarim.akhlaq'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          END
          cat > app/src/main/AndroidManifest.xml <<'END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="مكارم الاخلاق"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          END
          cat > app/src/main/java/com/makarim/akhlaq/MainActivity.java <<'END'
          package com.makarim.akhlaq;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity{
            protected void onCreate(Bundle b){
              super.onCreate(b);
              TextView tv=new TextView(this);
              tv.setText("مكارم الاخلاق - يعمل!");
              tv.setTextSize(28);
              setContentView(tv);
            }
          }
          END
          echo "android.useAndroidX=true" > gradle.properties
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makarim-APK
          path: app/build/outputs/apk/debug/*.apk
