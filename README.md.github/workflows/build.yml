name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Fix project
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew* workflowsbuild.yml
          mkdir -p app/src/main/java/com/makarim/akhlaq
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.0'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          echo "plugins{id 'com.android.application'} android{compileSdk 34; namespace 'com.makarim.akhlaq'; defaultConfig{applicationId 'com.makarim.akhlaq'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0'}}" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="مكارم الاخلاق"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.makarim.akhlaq; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b); TextView tv=new TextView(this); tv.setText("مكارم الاخلاق"); tv.setTextSize(28); setContentView(tv);}}' > app/src/main/java/com/makarim/akhlaq/MainActivity.java
          echo "android.useAndroidX=true" > gradle.properties
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Makarim-APK
          path: app/build/outputs/apk/debug/*.apk
